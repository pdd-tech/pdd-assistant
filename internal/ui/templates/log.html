{{define "title"}}Журнал запросов{{end}}
{{define "content"}}
<h1>Журнал запросов</h1>
<p class="muted">Вопросы учеников, новые сверху.</p>
{{template "messages" .}}
<section class="card">
  {{if .Logs}}<div class="table-wrap" role="region" aria-label="Журнал запросов" tabindex="0"><table><thead><tr><th scope="col">Дата и время</th><th scope="col">Ученик</th><th scope="col">Вопрос</th></tr></thead><tbody>
    {{range .Logs}}<tr><td class="nowrap">{{.CreatedAt}}</td><td>{{.Login}}</td><td class="log-question">{{.Question}}</td></tr>{{end}}
  </tbody></table></div>
  {{else}}<p class="muted">Ученики пока не задавали вопросов.</p>{{end}}
</section>
{{end}}
